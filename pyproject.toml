[tool.poetry]
name = "hw-module6-django-21-2"
version = "0.1.0"
description = ""
authors = ["vadimko4 <vad.informat@gmail.com>"]
readme = "README.md"
packages = [{include = "hw_module6_django_21"}]

[tool.poetry.dependencies]
python = "^3.13"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
isort = "^6.0.1"
mypy = "^1.16.1"


[tool.black]
line-length = 119
exclude ='''
(
  /(
    | \.git
  )
)'''


[tool.isort]
line_length = 119


[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
